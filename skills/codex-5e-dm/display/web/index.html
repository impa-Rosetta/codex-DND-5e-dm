<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>冒险手记 · Codex 5e DM</title>
  <link rel="stylesheet" href="/style.css">
  <script defer src="/app.js"></script>
</head>
<body>
  <div class="shell">
    <header class="masthead"><span class="sigil">✦</span><div><p class="eyebrow">CODEX 5E DM · 冒险手记</p><h1 id="campaign-name">未载入战役</h1></div><span id="connection" class="connection">连接中</span></header>
    <main>
      <section class="scene panel"><p class="eyebrow">当前位置</p><h2 id="scene-name">—</h2><p id="scene-hint">所有行动请在 Codex 聊天中声明。</p></section>
      <section class="panel" aria-labelledby="character-title"><div class="section-head"><h2 id="character-title">角色档案</h2><span id="character-level" class="chip">—</span></div><div id="character-empty" class="empty">尚未创建角色</div><div id="character-body" hidden><h3 id="character-name"></h3><p id="character-meta"></p><div class="vitals"><div><span>生命值</span><strong id="hp">—</strong></div><div><span>护甲等级</span><strong id="ac">—</strong></div><div><span>速度</span><strong id="speed">—</strong></div></div><div id="ability-grid" class="abilities"></div><div id="resources"></div></div></section>
      <section class="panel" aria-labelledby="map-title"><div class="section-head"><h2 id="map-title">探索地图</h2><span class="chip">仅显示已发现</span></div><div id="map" class="map"></div></section>
      <section class="panel" aria-labelledby="combat-title"><div class="section-head"><h2 id="combat-title">战斗顺序</h2><span id="round" class="chip">未进入战斗</span></div><div id="combatants" class="empty">平静时刻</div></section>
      <section class="panel" aria-labelledby="log-title"><div class="section-head"><h2 id="log-title">最近事件</h2><span class="chip">审计记录</span></div><ol id="event-list" class="events"></ol></section>
    </main><footer>只读面板 · 以已提交事件为准<br>在 Codex 聊天中进行对话与行动</footer>
  </div>
</body>
</html>
